<!DOCTYPE html>
<html lang="fr" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MPEY — PS4 GoldHEN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #010813;
      color: #c8d8f5;
      font-family: system-ui, -apple-system, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* LOGO MPEY */
    .mpey-logo {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #fff;
      line-height: 1;
      -webkit-text-stroke: 1px rgba(0,90,255,0.4);
      text-shadow: 0 0 1px #fff, 0 0 30px rgba(0,92,255,0.35);
      margin-bottom: 6px;
    }
    .mpey-rule {
      width: 300px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #005cff, transparent);
      opacity: 0.6;
      margin-bottom: 8px;
    }
    .mpey-sub {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: #2a3f6f;
      margin-bottom: 48px;
    }

    /* CARTE */
    .card {
      width: 100%;
      max-width: 400px;
      background: #030f28;
      border: 1px solid #0c2460;
      border-radius: 10px;
      padding: 24px 20px;
      text-align: center;
    }

    /* SPINNER */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #0c2460;
      border-top-color: #005cff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* BARRE DE PROGRESSION */
    .prog-track {
      height: 3px;
      background: #020c20;
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #005cff, #00cfff);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* STATUT — c'est l'élément que launch.js met à jour */
    #status {
      font-size: 12px;
      color: #2a5baa;
      letter-spacing: 0.08em;
      min-height: 18px;
      font-family: 'Courier New', monospace;
    }

    /* FOOTER */
    footer {
      margin-top: 28px;
      font-size: 10px;
      color: #0d1e3a;
      letter-spacing: 0.2em;
      text-align: center;
    }
    footer strong { color: #152a56; }
  </style>
</head>
<body>

  <div class="mpey-logo">MPEY</div>
  <div class="mpey-rule"></div>
  <div class="mpey-sub">PS4 · GoldHEN Loader · Goma, RDC</div>

  <div class="card">
    <div class="spinner"></div>
    <div class="prog-track">
      <div class="prog-fill" id="progFill"></div>
    </div>
    <!-- launch.js met à jour cet élément #status -->
    <div id="status">Initialisation...</div>
  </div>

  <footer>
    <strong>MPEY</strong> &nbsp;·&nbsp; Goma, RD Congo &nbsp;·&nbsp; GoldHEN by SiSTRo
  </footer>

  <!-- CRITIQUE : launch.js gère le cache AppCache et redirige vers exploit.html -->
  <script src="launch.js"></script>

</body>
</html>
